name: quant-profiler
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - sqlite
  - pip:
      # Quantization Engine & ML Boilerplate
      # llmcompressor replaces autoawq, which was archived 2025-05-11 and is
      # officially deprecated. It covers AWQ, GPTQ, int8 and FP8 via one API.
      - llmcompressor
      - transformers
      - accelerate
      - datasets
      
      # Serving Engine
      - vllm
      
      # Telemetry and Concurrency
      - aiohttp
      - pynvml
      - locust